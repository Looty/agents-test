<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Pug head -->
  <ellipse cx="100" cy="100" rx="70" ry="75" fill="#d4a574"/>
  
  <!-- Ears -->
  <ellipse cx="50" cy="70" rx="25" ry="35" fill="#b8885f"/>
  <ellipse cx="150" cy="70" rx="25" ry="35" fill="#b8885f"/>
  
  <!-- Face wrinkles -->
  <path d="M 70 85 Q 75 80 80 85" stroke="#9d7555" stroke-width="2" fill="none"/>
  <path d="M 120 85 Q 125 80 130 85" stroke="#9d7555" stroke-width="2" fill="none"/>
  <path d="M 85 75 Q 90 70 95 75" stroke="#9d7555" stroke-width="2" fill="none"/>
  <path d="M 105 75 Q 110 70 115 75" stroke="#9d7555" stroke-width="2" fill="none"/>
  
  <!-- Snout/muzzle area -->
  <ellipse cx="100" cy="115" rx="45" ry="35" fill="#e6c9a8"/>
  
  <!-- Nose -->
  <ellipse cx="100" cy="110" rx="15" ry="12" fill="#333"/>
  
  <!-- Eyes -->
  <circle cx="75" cy="95" r="10" fill="#2d1f14"/>
  <circle cx="125" cy="95" r="10" fill="#2d1f14"/>
  <circle cx="77" cy="93" r="3" fill="#fff"/>
  <circle cx="127" cy="93" r="3" fill="#fff"/>
  
  <!-- Mouth -->
  <path d="M 100 122 L 100 135" stroke="#333" stroke-width="2"/>
  <path d="M 100 135 Q 85 140 75 135" stroke="#333" stroke-width="2" fill="none"/>
  <path d="M 100 135 Q 115 140 125 135" stroke="#333" stroke-width="2" fill="none"/>
  
  <!-- Tongue (cute detail) -->
  <ellipse cx="100" cy="142" rx="8" ry="5" fill="#ff8fa3"/>
</svg>
